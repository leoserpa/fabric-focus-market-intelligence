<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><title>Focus Market Intelligence — Panorama Focus</title><desc>Fundo marfim suave para Power BI, 1920 por 1440 pixels. Quatro cartões e quatro painéis de gráficos. Valores e gráficos são adicionados como visuais nativos.</desc><rect width="1920" height="1440" fill="#F6F7F7"/><g font-family="Segoe UI, Arial, sans-serif"><g transform="translate(64 53)" fill="none" stroke="#E66C37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 31 V4 M2 31 H34"/><path d="M7 25 L15 18 L21 21 L31 9 M24 9 H31 V16"/></g><text x="116" y="83" font-size="25" fill="#23282B" font-weight="400" font-family="Segoe Print, Comic Sans MS, cursive">Focus Market Intelligence</text><text x="64" y="156" font-size="24" fill="#23282B" font-weight="600">Expectativas do mercado para 2026</text><text x="64" y="187" font-size="16.5" fill="#626E73"><tspan>Boletim Focus · trajetória dos últimos 6 meses</tspan><tspan dx="4" fill="#626E73">·</tspan><tspan dx="4" fill="#E66C37">laranja destaca os últimos 30 dias</tspan></text><rect x="64" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(89 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="21" cy="21" r="3"/><path d="M6 24L23 5"/></g><text x="87" y="294" font-size="18" fill="#23282B" font-weight="400">Inflação esperada (IPCA)</text><rect x="518" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(543 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24V4M3 24h24M7 19l5-6 4 3 8-10M19 6h5v5"/></g><text x="541" y="294" font-size="18" fill="#23282B" font-weight="400">Selic esperada</text><rect x="972" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(997 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M3 25h24M6 24V17h4v7M13 24V12h4v12M20 24V5h4v19"/></g><text x="995" y="294" font-size="18" fill="#23282B" font-weight="400">Crescimento esperado</text><rect x="1426" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(1451 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="11"/><path d="M17 9c-1-1-7-2-7 2s7 1 7 5-6 3-7 2M14 5v18"/></g><text x="1449" y="294" font-size="18" fill="#23282B" font-weight="400">Dólar esperado</text><rect x="64" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="447" font-size="24" fill="#23282B" font-weight="600">Qual é a inflação (IPCA) esperada para 2026?</text><text x="88" y="476" font-size="16.5" fill="#626E73"><tspan>IPCA acumulado no ano</tspan><tspan dx="4" font-weight="700">(%)</tspan><tspan dx="4">· evolução da mediana projetada nos últimos 6 meses</tspan></text><rect x="976" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="1000" y="447" font-size="24" fill="#23282B" font-weight="600">Qual é a Selic esperada para o fim de 2026?</text><text x="1000" y="476" font-size="16.5" fill="#626E73"><tspan>Taxa no encerramento do ano</tspan><tspan dx="4" font-weight="700">(% a.a.</tspan><tspan dx="4">) · evolução da mediana projetada nos últimos 6 meses</tspan></text><rect x="64" y="848" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="891" font-size="24" fill="#23282B" font-weight="600">Quanto a economia deve crescer em 2026?</text><text x="88" y="920" font-size="16.5" fill="#626E73"><tspan>Variação do PIB ante 2025</tspan><tspan dx="4" font-weight="700">(%)</tspan><tspan dx="4">· evolução da mediana projetada nos últimos 6 meses</tspan></text><rect x="976" y="848" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="1000" y="891" font-size="24" fill="#23282B" font-weight="600">Qual é o dólar esperado para o fim de 2026?</text><text x="1000" y="920" font-size="16.5" fill="#626E73"><tspan>Cotação no encerramento do ano</tspan><tspan dx="4" font-weight="700">(R$/US$)</tspan><tspan dx="4">· evolução da mediana projetada nos últimos 6 meses</tspan></text><text x="64" y="1409" font-size="14" fill="#626E73" font-weight="400">Fonte: Banco Central do Brasil · Expectativas de Mercado (Focus)</text><text x="1856" y="1409" font-size="14" fill="#626E73" font-weight="400" text-anchor="end">Desenvolvido por Leonardo Serpa</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><title>Focus Market Intelligence — Juros e inflação</title><desc>Página 3 para Power BI. Mostra a Selic vigente, a expectativa Focus para IPCA em 12 meses e a taxa de juro real ex-ante calculada pela Equação de Fisher. Séries e valores são adicionados como visuais nativos do Power BI.</desc><rect width="1920" height="1440" fill="#F6F7F7"/><g font-family="Segoe UI, Arial, sans-serif"><g transform="translate(64 53)" fill="none" stroke="#E66C37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 31 V4 M2 31 H34"/><path d="M7 25 L15 18 L21 21 L31 9 M24 9 H31 V16"/></g><text x="116" y="83" font-size="25" fill="#23282B" font-weight="400" font-family="Segoe Print, Comic Sans MS, cursive">Focus Market Intelligence</text><text x="64" y="156" font-size="24" fill="#23282B" font-weight="600">Como os juros e a inflação esperada afetam o juro real?</text><text x="64" y="187" font-size="16.5" fill="#626E73" font-weight="400">Selic vigente e expectativa de IPCA para os próximos 12 meses.</text><rect x="1466" y="132" width="390" height="56" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(1484 149)" fill="none" stroke="#E66C37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="18" height="17" rx="2"/><path d="M5 0v5M15 0v5M1 7h18"/></g><text x="1514" y="166" font-size="14" fill="#626E73" font-weight="400">Observação mais recente</text><text x="1838" y="166" font-size="14" fill="#23282B" font-weight="600" text-anchor="end">dd/mm/aaaa</text><rect x="64" y="218.25" width="580" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(89 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="21" cy="21" r="3"/><path d="M6 24L23 5"/></g><text x="87" y="294" font-size="18" fill="#23282B" font-weight="400">Selic vigente</text><rect x="670" y="218.25" width="580" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(695 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="21" cy="21" r="3"/><path d="M6 24L23 5"/></g><text x="693" y="294" font-size="18" fill="#23282B" font-weight="400">Inflação esperada · 12M</text><rect x="1276" y="218.25" width="580" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(1301 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="21" cy="21" r="3"/><path d="M6 24L23 5"/></g><text x="1299" y="294" font-size="18" fill="#23282B" font-weight="400">Juro real ex-ante</text><rect x="64" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="447" font-size="24" fill="#23282B" font-weight="600">Como evoluiu a taxa de juro real da economia em 2026?</text><text x="88" y="476" font-size="16.5" fill="#626E73" font-weight="400">Taxa calculada pela Equação de Fisher (Selic descontada da inflação futura) · histórico diário nos últimos 6 meses</text><rect x="976" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="1000" y="447" font-size="24" fill="#23282B" font-weight="600">Como o Copom conduziu a taxa Selic vigente em 2026?</text><text x="1000" y="476" font-size="16.5" fill="#626E73" font-weight="400">Meta oficial fixada nas reuniões do Comitê de Política Monetária (% a.a.) · histórico diário nos últimos 6 meses</text><rect x="64" y="848" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="891" font-size="24" fill="#23282B" font-weight="600">Como evoluiu a expectativa de inflação em 12 meses em 2026?</text><text x="88" y="920" font-size="16.5" fill="#626E73" font-weight="400">Mediana do IPCA suavizado em horizonte móvel de 12 meses (Base 1) · histórico diário nos últimos 6 meses</text><text x="1416" y="941" font-size="24" fill="#23282B" font-weight="600" text-anchor="middle">Como é calculado o juro real ex-ante?</text><text x="1416" y="970" font-size="16.5" fill="#626E73" font-weight="400" text-anchor="middle">Relação entre a taxa nominal vigente e a inflação esperada</text><text x="1344" y="1101" font-size="28" fill="#23282B" font-weight="500" text-anchor="middle">( 1 + Selic / 100 )</text><line x1="1179" y1="1118" x2="1509" y2="1118" stroke="#CBD2D5" stroke-width="1.4"/><text x="1344" y="1153" font-size="28" fill="#23282B" font-weight="500" text-anchor="middle">( 1 + IPCA 12M / 100 )</text><text x="1526" y="1126" font-size="28" fill="#23282B" font-weight="500">− 1 ) × 100</text><text x="1156" y="1126" font-size="28" fill="#23282B" font-weight="500">(</text><text x="1416" y="1206" font-size="15" fill="#626E73" font-weight="400" text-anchor="middle">O IPCA 12M é a mediana da expectativa Focus em horizonte móvel.</text><text x="1416" y="1231" font-size="15" fill="#626E73" font-weight="400" text-anchor="middle">A taxa Selic usada é a vigente na mesma data da observação.</text><text x="64" y="1305" font-size="15" fill="#626E73"><tspan fill="#23282B" font-weight="600">Cálculo · </tspan><tspan>Equação de Fisher com Selic Meta e IPCA esperado em 12 meses (Base 1, últimos 5 dias úteis).</tspan></text><text x="64" y="1329" font-size="15" fill="#626E73"><tspan fill="#23282B" font-weight="600">Leitura · </tspan><tspan>Juro real ex-ante é uma estimativa antes da inflação efetivamente observada; não é retorno garantido.</tspan></text><text x="64" y="1409" font-size="14" fill="#626E73" font-weight="400">Fonte: Banco Central do Brasil · SGS e Expectativas de Mercado (Focus)</text><text x="1856" y="1409" font-size="14" fill="#626E73" font-weight="400" text-anchor="end">Desenvolvido por Leonardo Serpa</text></g></svg>
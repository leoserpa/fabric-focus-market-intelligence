<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><title>Focus Market Intelligence — Mercado × Top 5</title><desc>Template de fundo para Power BI. Compara projeções de IPCA e Selic do mercado e do Top 5, com divergências do IPCA e das projeções por ano de referência em barras.</desc><rect width="1920" height="1440" fill="#F6F7F7"/><g font-family="Segoe UI, Arial, sans-serif"><g transform="translate(64 53)" fill="none" stroke="#E66C37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 31 V4 M2 31 H34"/><path d="M7 25 L15 18 L21 21 L31 9 M24 9 H31 V16"/></g><text x="116" y="83" font-size="25" fill="#23282B" font-weight="400" font-family="Segoe Print, Comic Sans MS, cursive">Focus Market Intelligence</text><text x="64" y="156" font-size="24" fill="#23282B" font-weight="600">Expectativas do Focus · <tspan fill="#A4AAAD">Mercado</tspan> × <tspan fill="#E66C37">Top 5</tspan></text><text x="64" y="187" font-size="16.5" fill="#626E73">Medianas para o ano de referência · histórico das projeções nos últimos 6 meses</text><rect x="1466" y="132" width="390" height="56" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(1484 149)" fill="none" stroke="#23282B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="18" height="17" rx="2"/><path d="M5 0v5M15 0v5M1 7h18"/></g><rect x="64" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(89 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3L3 25h22L14 3z"/><path d="M9 19h10"/></g><text x="87" y="294" font-size="18" fill="#23282B" font-weight="400">Divergência · IPCA</text><rect x="518" y="218.25" width="430" height="160" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><g transform="translate(543 241)" fill="none" stroke="#23282B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3L3 25h22L14 3z"/><path d="M9 19h10"/></g><text x="541" y="294" font-size="18" fill="#23282B" font-weight="400">Divergência · Selic</text><rect x="64" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="447" font-size="24" fill="#23282B" font-weight="600">Como evoluiu a projeção do IPCA para 2026 no <tspan fill="#E66C37">Top 5</tspan> e no <tspan fill="#A4AAAD">mercado</tspan>?</text><text x="88" y="476" font-size="16.5" fill="#626E73" font-weight="400">Mediana anual do IPCA (%) · revisões do ano de referência nos últimos 6 meses</text><rect x="976" y="404" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="1000" y="447" font-size="24" fill="#23282B" font-weight="600">Como evoluiu a projeção da Selic para 2026 no <tspan fill="#E66C37">Top 5</tspan> e no <tspan fill="#A4AAAD">mercado</tspan>?</text><text x="1000" y="476" font-size="16.5" fill="#626E73" font-weight="400">Mediana da taxa no fim do ano de referência (% a.a.) · revisões nos últimos 6 meses</text><rect x="64" y="848" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="88" y="891" font-size="24" fill="#23282B" font-weight="600">O Top 5 está mais otimista ou pessimista com a inflação (IPCA) de 2026?</text><text x="88" y="920" font-size="16.5" fill="#626E73" font-weight="400"><tspan fill="#626E73">Divergência (</tspan><tspan fill="#626E73">Top 5</tspan><tspan fill="#626E73"> − </tspan><tspan fill="#626E73">Mercado</tspan><tspan fill="#626E73"> em p.p.) nos últimos 6 meses.</tspan></text><text x="88" y="941" font-size="16.5" fill="#626E73" font-weight="400"><tspan fill="#626E73">Barras abaixo de zero indicam </tspan><tspan fill="#626E73">Top 5</tspan><tspan fill="#626E73"> esperando inflação menor que o </tspan><tspan fill="#626E73">mercado</tspan><tspan fill="#626E73"> geral.</tspan></text><rect x="976" y="848" width="880" height="420" rx="7.5" fill="#FFFFFF" stroke="#CBD2D5" stroke-width="1.2"/><text x="1000" y="891" font-size="24" fill="#23282B" font-weight="600">Como o Top 5 projeta os próximos anos frente ao mercado?</text><text x="1000" y="920" font-size="16.5" fill="#626E73" font-weight="400"><tspan fill="#626E73">Comparativo na última observação por ano de referência. </tspan></text><text x="1000" y="941" font-size="16.5" fill="#626E73" font-weight="400"><tspan fill="#626E73">Destaque em </tspan><tspan fill="#E66C37">laranja</tspan><tspan fill="#626E73"> indica viés mais alto (Hawkish) das instituições de maior acurácia.</tspan></text><text x="64" y="1305" font-size="16" fill="#626E73"><tspan fill="#23282B" font-weight="600">Metodologia · </tspan><tspan>Panorama Focus usa Base 0 (respostas dos últimos 30 dias); Mercado × Top 5 usa Base 1 (últimos 5 dias úteis) para destacar as respostas mais recentes.</tspan></text><text x="64" y="1329" font-size="16" fill="#626E73"><tspan fill="#A4AAAD" font-weight="600">Mercado:</tspan><tspan dx="4">mediana das projeções dos participantes dentro da janela indicada. Os valores podem diferir entre as páginas por causa desse período.</tspan></text><text x="64" y="1353" font-size="16" fill="#626E73"><tspan fill="#E66C37" font-weight="600">Top 5:</tspan><tspan dx="4">mediana das projeções das cinco instituições mais bem classificadas no ranking de curto prazo do Focus.</tspan></text><text x="64" y="1409" font-size="14" fill="#626E73" font-weight="400">Fonte: Banco Central do Brasil · Expectativas de Mercado (Focus)</text><text x="1856" y="1409" font-size="14" fill="#626E73" font-weight="400" text-anchor="end">Desenvolvido por Leonardo Serpa</text></g></svg>